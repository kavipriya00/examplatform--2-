{% extends "base.html" %}
{% block title %}Upload Syllabus{% endblock %}
{% block content %}
<h2>Upload Syllabus PDF</h2>
{% if messages %}{% for m in messages %}<p>{{ m }}</p>{% endfor %}{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload & Extract</button>
</form>
{% endblock %}
